    title_ru: "Значения настроек трех уровней"
    group: dbms_state
    priority: P3
    applies_to: [standalone, replicated]
    scope: saas
    tables: [system.settings, system.server_settings, system.merge_tree_settings]
    since: "23.11"
    interval: 1h
    query: |
      SELECT
        toInt64OrNull(maxIf(value, name = 'max_memory_usage'))              AS max_memory_usage_bytes,
        toInt64OrNull(maxIf(value, name = 'max_memory_usage_for_user'))     AS max_memory_usage_for_user_bytes,
        toInt64OrNull(maxIf(value, name = 'max_concurrent_queries'))        AS max_concurrent_queries,
        toInt64OrNull(maxIf(value, name = 'max_execution_time'))            AS max_execution_time_s,
        toInt64OrNull(maxIf(value, name = 'max_threads'))                   AS max_threads,
        toInt64OrNull(maxIf(value, name = 'max_insert_threads'))            AS max_insert_threads,
        toInt64OrNull(maxIf(value, name = 'max_block_size'))                AS max_block_size,
        toInt64OrNull(maxIf(value, name = 'max_insert_block_size'))         AS max_insert_block_size,
        toInt64OrNull(maxIf(value, name = 'max_bytes_before_external_group_by')) AS max_bytes_before_external_group_by,
        toInt64OrNull(maxIf(value, name = 'max_bytes_before_external_sort'))     AS max_bytes_before_external_sort,
        toInt64OrNull(maxIf(value, name = 'distributed_aggregation_memory_efficient')) AS distributed_aggregation_memory_efficient,
        toInt64OrNull(maxIf(value, name = 'use_async_insert'))              AS use_async_insert,
        toInt64OrNull(maxIf(value, name = 'async_insert_max_data_size'))    AS async_insert_max_data_size,
        toInt64OrNull(maxIf(value, name = 'async_insert_max_query_number')) AS async_insert_max_query_number,
        toInt64OrNull(maxIf(value, name = 'mutations_sync'))                AS mutations_sync,
        toInt64OrNull(maxIf(value, name = 'max_connections'))               AS max_connections,
        toFloat64OrNull(maxIf(value, name = 'http_keep_alive_timeout'))     AS http_keep_alive_timeout,
        toInt64OrNull(maxIf(value, name = 'background_pool_size'))          AS background_pool_size,
        toInt64OrNull(maxIf(value, name = 'background_merges_mutations_pool_size')) AS background_merges_mutations_pool_size,
        toFloat64OrNull(maxIf(value, name = 'background_merges_mutations_concurrency_ratio')) AS background_merges_mutations_concurrency_ratio,
        toInt64OrNull(maxIf(value, name = 'max_part_mutations'))            AS max_part_mutations,
        toInt64OrNull(maxIf(value, name = 'max_replicated_merges_in_queue')) AS max_replicated_merges_in_queue,
        toInt64OrNull(maxIf(value, name = 'lightweight_deletes_sync'))      AS lightweight_deletes_sync,
        toInt64OrNull(maxIf(value, name = 'distributed_directory_monitor_sleep_time_ms')) AS distributed_directory_monitor_sleep_time_ms,
        toInt64OrNull(maxIf(value, name = 'parts_to_delay_insert'))         AS parts_to_delay_insert,
        toInt64OrNull(maxIf(value, name = 'parts_to_throw_insert'))         AS parts_to_throw_insert,
        toInt64OrNull(maxIf(value, name = 'max_parts_to_merge_at_once'))    AS max_parts_to_merge_at_once,
        toInt64OrNull(maxIf(value, name = 'min_compress_block_size'))       AS min_compress_block_size,
        toInt64OrNull(maxIf(value, name = 'max_compress_block_size'))       AS max_compress_block_size
      FROM
      (
        SELECT name,
               if(value IN ('true', '1'), '1', if(value IN ('false', '0'), '0', toString(value))) AS value
        FROM system.settings
        WHERE name IN
        (
          'max_memory_usage', 'max_memory_usage_for_user', 'max_concurrent_queries',
          'max_execution_time', 'max_threads', 'max_insert_threads', 'max_block_size',
          'max_insert_block_size', 'max_bytes_before_external_group_by',
          'max_bytes_before_external_sort', 'distributed_aggregation_memory_efficient',
          'use_async_insert', 'async_insert_max_data_size', 'async_insert_max_query_number',
          'mutations_sync'
        )
        UNION ALL
        SELECT name,
               if(value IN ('true', '1'), '1', if(value IN ('false', '0'), '0', toString(value))) AS value
        FROM system.server_settings
        WHERE name IN
        (
          'max_connections', 'http_keep_alive_timeout', 'background_pool_size',
          'background_merges_mutations_pool_size', 'background_merges_mutations_concurrency_ratio',
          'max_part_mutations', 'max_replicated_merges_in_queue', 'lightweight_deletes_sync',
          'distributed_directory_monitor_sleep_time_ms'
        )
        UNION ALL
        SELECT name,
               if(value IN ('true', '1'), '1', if(value IN ('false', '0'), '0', toString(value))) AS value
        FROM system.merge_tree_settings
        WHERE name IN
        (
          'parts_to_delay_insert', 'parts_to_throw_insert', 'max_parts_to_merge_at_once',
          'min_compress_block_size', 'max_compress_block_size', 'mutations_sync',
          'lightweight_deletes_sync'
        )
      )
    thresholds: []
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { max_memory_usage_bytes: bytes, max_memory_usage_for_user_bytes: bytes,
                max_concurrent_queries: count, max_execution_time_s: seconds, max_threads: count,
                max_insert_threads: count, max_block_size: count, max_insert_block_size: count,
                max_bytes_before_external_group_by: bytes, max_bytes_before_external_sort: bytes,
                distributed_aggregation_memory_efficient: count, use_async_insert: count,
                async_insert_max_data_size: bytes, async_insert_max_query_number: count,
                mutations_sync: count, max_connections: count, http_keep_alive_timeout: seconds,
                background_pool_size: count, background_merges_mutations_pool_size: count,
                background_merges_mutations_concurrency_ratio: ratio, max_part_mutations: count,
                max_replicated_merges_in_queue: count, lightweight_deletes_sync: count,
                distributed_directory_monitor_sleep_time_ms: ms, parts_to_delay_insert: count,
                parts_to_throw_insert: count, max_parts_to_merge_at_once: count,
                min_compress_block_size: count, max_compress_block_size: count }
    owner: "clickwatch"
    labels: [P3, config, daily]
    notes: >-
      Вне чек-листа. Добавлено по результатам сверки с коллектором r620 (§7-§10):
      полный числовой снимок настроек вместо одного отпечатка (id 28) - заполняет
      колонки g_* таблицы agent_metrics и даёт материал для аудита настроек
      (global_settings_history: SaaS сравнивает последовательные снимки).
      Три источника: профильные настройки (system.settings), серверные
      (system.server_settings, есть с 23.11 - поэтому since 23.11),
      MergeTree (system.merge_tree_settings). Булевы значения 'true'/'false'
      мапятся в 1/0, отсутствующее имя даёт NULL (пропуск серии, не ноль).
      Пересечение имён между sources (mutations_sync, lightweight_deletes_sync)
      допустимо - значения совпадают. Единицы: байты, секунды, мс, счётчик,
      коэффициент (unit_map).

  - id: 49
    uid: "ch.state.tables"
    title_en: "Tables Inventory (per node)"
    title_ru: "Перечень таблиц ноды"
    group: dbms_state
    priority: P3
    applies_to: [standalone, replicated]
    scope: saas
    tables: [system.tables, system.parts, system.replicas]
    since: "20.7"
    interval: 1h
    query: |
      -- Многострочная выдача (sample-канал, не агрегат): строка на таблицу
      -- ноды. В SaaS уходит в clickwatch.agent_tables_log; в проекцию
      -- agent_metrics НЕ проецируется (как ch.queries.raw_log).
      SELECT
        t.database        AS database,
        t.name            AS table,
        t.engine          AS engine,
        t.partition_key   AS partition_key,
        if(positionCaseInsensitive(t.engine_full, 'TTL') > 0,
           substring(t.engine_full, positionCaseInsensitive(t.engine_full, 'TTL'), 200),
           '')            AS ttl,
        if(startsWith(t.engine, 'Replicated'),
           replaceAll(substring(t.engine_full, position(t.engine_full, '(') + 1,
                      position(t.engine_full, ',') - position(t.engine_full, '(') - 1),
                      '''', ''),
           '')            AS zpath,
        coalesce(p.total_rows, 0)  AS rows,
        coalesce(p.total_bytes, 0) AS bytes,
        coalesce(p.parts_cnt, 0)   AS parts
      FROM system.tables AS t
      LEFT JOIN
      (
        SELECT database, table, sum(rows) AS total_rows, sum(bytes) AS total_bytes,
               count() AS parts_cnt
        FROM system.parts WHERE active GROUP BY database, table
      ) AS p ON p.database = t.database AND p.table = t.name
      WHERE t.database NOT IN ('system', 'information_schema', 'INFORMATION_SCHEMA')
    thresholds: []
    threshold_version: 1
    thresholds_updated_at: "2026-11-05T00:00:00Z"
    thresholds_source: builtin
    unit_map: { rows: count, bytes: bytes, parts: count }
    owner: "clickwatch"
    labels: [P3, inventory, hourly]
    notes: >-
      Перечень таблиц ноды (задание 2026-11-05, ж129): база + таблица +
      движок + ключ партиционирования / TTL из engine_full + счётчики
      строк/объёма/частей на ноде. Путь реплики (zpath) лучше брать из
      system.replicas.zookeeper_path - он уже интерполирован по ноде
      (у реплик одного набора путь одинаковый, у шардов разный); в
      эталонной выборке путь вытащен из engine_full с макросами -
      реализующие агенты (python) шлют zookeeper_path. system.* и
      information_schema не собираются. Проверки_cliente страницы
      (расхождение реплик, таблица есть не на всех нодах, рост без TTL)
      считаются на сервере; детектор из этого канала не читает.

  # --------------------------------------------------------------------------
  # Блок G. Сводка ошибок по группам (вне чек-листа; решения 2026-11-10, ж248/252)
  # --------------------------------------------------------------------------

  - id: 50
    uid: "ch.errors.top_texts"
    title_en: "Error Groups Fact (5 slots, 24h)"
    title_ru: "Сводка ошибок по группам (5 слотов, 24 ч)"
    group: dbms_state
    priority: P3
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.query_log, system.text_log]
    interval: 15m
    query: |
      -- Сводка-факт «первопричина»: ОШИБКИ ПО ГРУППАМ за 24 ч, БЕЗ порогов
      -- (решение заказчика 2026-11-10: детали не нужны — только факт:
      -- тип ошибки (по группе), счёт повторов и время последнего).
      -- Инциденты правило само не открывает. Группы по коду:
      -- Лимиты памяти (241/242), Таймауты (159/160), Read-only реплики
      -- (514/515/516), Доступ и права (497), Прочие; сбои журнала сервера
      -- (text_log Error/Fatal) — отдельная группа «Ядро (журнал)».
      -- Механика runner: метрики собираются ТОЛЬКО из первой строки
      -- результата, поэтому топ-5 групп — колонки-слоты err1..err5
      -- (счёт) и err1_text..err5_text («группа · последний НН:ММ:СС»,
      -- нечисловое значение приёмник кладёт в value_text).
      WITH
      g AS
      (
        SELECT
          multiIf(exception_code IN (241, 242), 'Лимиты памяти',
                  exception_code IN (159, 160), 'Таймауты',
                  exception_code IN (514, 515, 516), 'Read-only реплики',
                  exception_code = 497, 'Доступ и права',
                  'Прочие')            AS grp,
          count()                      AS c,
          max(event_time)              AS t
        FROM system.query_log
        WHERE event_date >= today() - 2
          AND event_time >= now() - INTERVAL 24 HOUR
          AND exception != ''
        GROUP BY grp
      ),
      l AS
      (
        SELECT 'Ядро (журнал)'         AS grp,
               count()                 AS c,
               max(event_time)         AS t
        FROM system.text_log
        WHERE event_date >= today() - 2
          AND event_time >= now() - INTERVAL 24 HOUR
          AND level IN ('Error', 'Fatal')
      ),
      agg AS
      (
        SELECT grp, sum(c) AS c, max(t) AS t
        FROM (SELECT grp, c, t FROM g UNION ALL SELECT grp, c, t FROM l)
        GROUP BY grp
        ORDER BY c DESC, t DESC
        LIMIT 5
      ),
      a AS
      (
        SELECT count()             AS n,
               groupArray(grp)     AS a_grp,
               groupArray(c)       AS a_c,
               groupArray(t)       AS a_t
        FROM agg
      )
      SELECT
        toUInt64(arrayElement(a_c, 1)) AS err1,
        toUInt64(arrayElement(a_c, 2)) AS err2,
        toUInt64(arrayElement(a_c, 3)) AS err3,
        toUInt64(arrayElement(a_c, 4)) AS err4,
        toUInt64(arrayElement(a_c, 5)) AS err5,
        if(arrayElement(a_c, 1) = 0, '', substring(concat(
          arrayElement(a_grp, 1), ' · последний ',
          formatDateTime(arrayElement(a_t, 1), '%H:%i:%S')), 1, 200)) AS err1_text,
        if(arrayElement(a_c, 2) = 0, '', substring(concat(
          arrayElement(a_grp, 2), ' · последний ',
          formatDateTime(arrayElement(a_t, 2), '%H:%i:%S')), 1, 200)) AS err2_text,
        if(arrayElement(a_c, 3) = 0, '', substring(concat(
          arrayElement(a_grp, 3), ' · последний ',
          formatDateTime(arrayElement(a_t, 3), '%H:%i:%S')), 1, 200)) AS err3_text,
        if(arrayElement(a_c, 4) = 0, '', substring(concat(
          arrayElement(a_grp, 4), ' · последний ',
          formatDateTime(arrayElement(a_t, 4), '%H:%i:%S')), 1, 200)) AS err4_text,
        if(arrayElement(a_c, 5) = 0, '', substring(concat(
          arrayElement(a_grp, 5), ' · последний ',
          formatDateTime(arrayElement(a_t, 5), '%H:%i:%S')), 1, 200)) AS err5_text
      FROM a
    thresholds: []
    threshold_version: 1
    thresholds_updated_at: "2026-11-10T00:00:00Z"
    thresholds_source: builtin
    unit_map: { err1: count, err2: count, err3: count, err4: count, err5: count,
                err1_text: text, err2_text: text, err3_text: text,
                err4_text: text, err5_text: text }
    owner: "clickwatch"
    labels: [P3, errors, 15m]
    notes: >-
      Вне чек-листа. Задание 2026-11-10 (ж248): тексты ошибок ClickHouse
      от агента в витрину - сводка-факт, а не сырой лог. ДУТУ во втором
      раунде (ж252, тот же день): «по текстам ошибок детали не нужны -
      только факт»: ошибки делятся на ГРУППЫ, в карточке говорят о факте
      ошибки, времени и типе (по группе). Группы по коду: Лимиты памяти
      (241/242), Таймауты (159/160), Read-only реплики (514/515/516),
      Доступ и права (497), Прочие; сбои text_log Error/Fatal - «Ядро
      (журнал)». слоты err1..err5 - топ-5 групп по счёту за 24 ч
      (value = число повторов), err1_text..err5_text (value_text) -
      «Группа · последний НН:ММ:СС» (время локальное сервера CH).
      Сообщения, пользователи, QueryID и тексты запросов НЕ передаются.
      Механика runner (метрики только из первой строки) диктует пивот
      в одну строку. Пустые слоты: счёт 0 и пустая строка (точка без
      значения не пишется). Правило БЕЗ порогов: инциденты оно не
      открывает (штатные числовые каналы остаются единственным триггером),
      витрина подписывает первопричину фактами этой сводки.
      Слияние слоёв: отключение - локальный overlay (enabled: false)
      или слой SaaS без изменений кода.

# ----------------------------------------------------------------------------
# Телеметрия самого агента (self_rules, см. описание формата правил (в README репозитория) разд. 5)
# ----------------------------------------------------------------------------

self_rules:
  - uid: "ch.agent.rules.dataset_version"
    title: "Rules dataset version in use"
    source: internal
    interval: 15m
    thresholds: []
    owner: "clickwatch"

  - uid: "ch.agent.rules.dataset_age_hours"
    title: "Rules dataset staleness"
    source: internal
    interval: 1h
    thresholds:
      - { metric: ruleset_age_hours, op: gte, value: 336, severity: warning }
      - { metric: ruleset_age_hours, op: gte, value: 600, severity: critical }
    owner: "clickwatch"

  - uid: "ch.agent.rules.last_fetch_status"
    title: "Last rules fetch outcome"
    source: internal
    interval: 15m
    thresholds:
      - { metric: last_fetch_status, op: gte, value: 2, severity: warning }
    owner: "clickwatch"

  - uid: "ch.agent.rules.last_fetch_age_hours"
    title: "Hours since successful rules fetch"
    source: internal
    interval: 1h
    thresholds:
      - { metric: last_fetch_age_hours, op: gte, value: 4, severity: critical }
    owner: "clickwatch"

  - uid: "ch.agent.ch.unreachable_seconds"
    title: "ClickHouse down on this node"
    source: internal
    interval: 1m
    thresholds:
      - { metric: unreachable_seconds, op: gte, value: 60,  severity: warning }
      - { metric: unreachable_seconds, op: gte, value: 300, severity: critical }
    owner: "clickwatch"

  - uid: "ch.agent.access.denied_tables_count"
    title: "System tables currently denied"
    source: internal
    interval: 15m
    thresholds:
      - { metric: denied_tables_count, op: gte, value: 1, severity: warning }
    owner: "clickwatch"

  - uid: "ch.agent.access.last_change_hours"
    title: "Hours since last access change"
    source: internal
    interval: 1h
    thresholds: []
    owner: "clickwatch"

  - uid: "ch.agent.status"
    title: "Agent activity state (0 active, 1 dormant, 2 no-client)"
    source: internal
    interval: 15m
    thresholds:
      - { metric: agent_state, op: gte, value: 1, severity: critical }
    owner: "clickwatch"

  - uid: "ch.agent.time.drift_ms"
    title: "ClickHouse vs agent clock drift"
    source: internal
    interval: 15m
    thresholds:
      - { metric: drift_ms, op: gte, value: 5000,  severity: warning }
      - { metric: drift_ms, op: gte, value: 30000, severity: critical }
    owner: "clickwatch"

  - uid: "ch.agent.rules.yaml_updated_at"
    title: "Epoch when rules.yaml was last reloaded"
    source: internal
    interval: 1h
    thresholds: []
    owner: "clickwatch"

  - uid: "ch.agent.work.rows_collected_total"
    title: "Lifetime rows collected counter"
    source: internal
    interval: 1h
    thresholds: []
    owner: "clickwatch"
