    thresholds:
      - { metric: max_parts_to_check, op: gte, value: 50,  severity: warning }
      - { metric: max_parts_to_check, op: gte, value: 200, severity: critical }
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { max_parts_to_check: count }
    owner: "clickwatch"
    labels: [P2, integrity, weekly]
    notes: >-
      Чек-лист п.26. Проверка частей поднимается после подозрений на порчу данных.

  - id: 27
    uid: "ch.state.version_drift"
    title_en: "Version Drift"
    title_ru: "Версионный дрейф нод"
    group: dbms_state
    priority: P1
    applies_to: [standalone, replicated]
    scope: saas
    tables: []
    interval: 1h
    query: |
      SELECT version() AS ch_version, hostname() AS hostname
    thresholds: []
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: {}
    owner: "clickwatch"
    labels: [P1, upgrades, weekly]
    notes: >-
      Чек-лист п.27. SaaS сравнивает версии нод кластера; major mismatch - paging.

  - id: 28
    uid: "ch.state.settings_fingerprint"
    title_en: "Settings Drift"
    title_ru: "Дрейф настроек (отпечаток)"
    group: dbms_state
    priority: P3
    applies_to: [standalone, replicated]
    scope: saas
    tables: [system.settings]
    interval: 1h
    query: |
      SELECT
        hex(SHA256(toString(arraySort(groupArray(s)))))                      AS settings_fingerprint,
        toUInt64(count())                                                   AS settings_rows,
        toInt64OrNull(maxIf(value, name = 'mutations_sync'))                 AS mutations_sync,
        toInt64OrNull(maxIf(value, name = 'max_memory_usage'))               AS max_memory_usage_bytes,
        toInt64OrNull(maxIf(value, name = 'max_execution_time'))             AS max_execution_time_s,
        toInt64OrNull(maxIf(value, name = 'background_pool_size'))           AS background_pool_size,
        toFloat64OrNull(maxIf(value,
          name = 'background_merges_mutations_concurrency_ratio'))           AS background_merges_mutations_concurrency_ratio,
        toInt64OrNull(maxIf(value, name = 'max_part_mutations'))             AS max_part_mutations,
        toInt64OrNull(maxIf(value, name = 'max_replicated_merges_in_queue')) AS max_replicated_merges_in_queue,
        toInt64OrNull(maxIf(value, name = 'lightweight_deletes_sync'))       AS lightweight_deletes_sync
      FROM
      (
        SELECT name, value, concat(name, '=', toString(value)) AS s
        FROM system.settings
        WHERE name IN
        (
          'mutations_sync', 'max_memory_usage', 'max_execution_time',
          'background_pool_size', 'background_merges_mutations_concurrency_ratio',
          'max_part_mutations', 'max_replicated_merges_in_queue',
          'lightweight_delete_mode', 'lightweight_deletes_sync'
        )
      )
    thresholds: []
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { settings_rows: count, mutations_sync: count, max_memory_usage_bytes: bytes,
                max_execution_time_s: seconds, background_pool_size: count,
                background_merges_mutations_concurrency_ratio: ratio, max_part_mutations: count,
                max_replicated_merges_in_queue: count, lightweight_deletes_sync: count }
    owner: "clickwatch"
    labels: [P3, config, weekly]
    notes: >-
      Чек-лист п.28. Отпечаток критичных настроек; SaaS сравнивает между репликами
      кластера (расхождение = дрейф конфигурации). Хеш раскрыт значениями: числовые
      настройки дублируются отдельными метриками для временных рядов (динамика
      лимитов: max_memory_usage - байты, max_execution_time - секунды, остальные -
      счётчики/коэффициент). Текстовая lightweight_delete_mode входит только в хеш -
      ряд из текста не строится. Отсутствующая на старой версии настройка даёт NULL:
      пропуск серии, не ноль.

  - id: 29
    uid: "ch.state.ddl_queue_stuck"
    title_en: "Distributed DDL Queue Stuck"
    title_ru: "Застревание DDL-очереди"
    group: dbms_state
    priority: P1
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.distributed_ddl_queue]
    since: "24.0"
    interval: 15m
    query: |
      SELECT
        toUInt64(count())                                AS ddl_pending,
        round(coalesce(max(intDiv(now() - time, 60)), 0), 0) AS oldest_ddl_min
      FROM system.distributed_ddl_queue
    thresholds:
      - { metric: oldest_ddl_min, op: gte, value: 10, severity: warning }
      - { metric: oldest_ddl_min, op: gte, value: 60, severity: critical }
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { oldest_ddl_min: minutes, ddl_pending: count }
    owner: "clickwatch"
    labels: [P1, ddl, daily]
    notes: >-
      Чек-лист п.29. Таблица появилась в 24.x; в 23.x правило пропустится (since: 24.0) -
      там DDL-очередь наблюдают прямо в Keeper.

  - id: 30
    uid: "ch.state.server_log_errors"
    title_en: "Server Log Errors"
    title_ru: "Ошибки серверного лога"
    group: dbms_state
    priority: P2
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.text_log]
    interval: 15m
    query: |
      SELECT
        toUInt64(countIf(level = 'Fatal')) AS fatal_hour,
        toUInt64(countIf(level = 'Error')) AS errors_hour
      FROM system.text_log
      WHERE event_date >= today() - 1
        AND event_time >= now() - INTERVAL 1 HOUR
    thresholds:
      - { metric: fatal_hour,  op: gte, value: 1,  severity: critical }
      - { metric: errors_hour, op: gte, value: 50, severity: warning }
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { fatal_hour: count, errors_hour: count }
    owner: "clickwatch"
    labels: [P2, logs, daily]
    notes: >-
      Чек-лист п.30. Записи FATAL в text_log -paging-событие.

  # --------------------------------------------------------------------------
  # Блок F. Фоновые процессы (чек-лист 31-34)
  # --------------------------------------------------------------------------

  - id: 31
    uid: "ch.background.merges_health"
    title_en: "Merge Progress / Failures"
    title_ru: "Мерджи: прогресс и сбои"
    group: background
    priority: P2
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.merges, system.part_log, system.asynchronous_metrics]
    interval: 15m
    query: |
      SELECT
        toUInt64(count())                   AS active_merges,
        round(coalesce(max(elapsed), 0), 0) AS oldest_merge_sec,
        toUInt64((SELECT countIf(error != '')
                  FROM system.part_log
                  WHERE event_type = 'MergeParts'
                    AND event_date >= today() - 1
                    AND event_time >= now() - INTERVAL 1 HOUR)) AS merge_failures_hour,
        toInt64((SELECT maxIf(value, metric = 'MemoryTrackingInBackgroundMerges') FROM system.asynchronous_metrics)) AS merge_memory
      FROM system.merges
    thresholds:
      - { metric: oldest_merge_sec,    op: gte, value: 3600, severity: warning }
      - { metric: merge_failures_hour, op: gte, value: 10,   severity: warning }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { oldest_merge_sec: seconds, merge_failures_hour: count, active_merges: count,
                merge_memory: bytes }
    owner: "clickwatch"
    labels: [P2, merges, daily]
    notes: >-
      Чек-лист п.31. Долгие/падающие мерджи мешают мутациям занимать пул.
      Переименование running_merges -> active_merges (реестр №61, совместимость с ClickWatch);
      merge_memory - async.MemoryTrackingInBackgroundMerges (реестр №23).

  - id: 32
    uid: "ch.background.slow_merges"
    title_en: "Slow Merges / Write Amplification"
    title_ru: "Скорость слияний"
    group: background
    priority: P2
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.part_log]
    interval: 1h
    query: |
      SELECT
        toUInt64(quantile(0.95)(duration_ms)) AS p95_merge_ms,
        toUInt64(count())                     AS merges_24h
      FROM system.part_log
      WHERE event_type = 'MergeParts'
        AND event_date >= today() - 1
        AND event_time >= now() - INTERVAL 24 HOUR
    thresholds:
      - { metric: p95_merge_ms, op: gte, value: 600000, severity: warning }
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { p95_merge_ms: ms, merges_24h: count }
    owner: "clickwatch"
    labels: [P2, merges, daily]
    notes: >-
      Чек-лист п.32. Decile P95 по длительности мерджей за сутки.

  - id: 33
    uid: "ch.background.pool_utilization"
    title_en: "Background Pool Utilization"
    title_ru: "Утилизация фонового пула"
    group: background
    priority: P1
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.metrics, system.settings]
    since: "22.6"
    interval: 15m
    query: |
      WITH (SELECT max(toUInt64(value)) FROM system.settings WHERE name = 'background_pool_size') AS pool_size
      SELECT
        if(pool_size > 0,
           round(maxIf(value, metric = 'BackgroundMergesAndMutationsPoolTask') * 100.0 / pool_size, 0), -1)
            AS bg_pool_utilization,
        toUInt64(maxIf(value, metric = 'BackgroundMergesAndMutationsPoolTask')) AS merge_queue_size,
        toUInt64(pool_size) AS pool_size
      FROM system.metrics
    thresholds:
      - { metric: bg_pool_utilization, op: gte, value: 80,  severity: warning }
      - { metric: bg_pool_utilization, op: gte, value: 100, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { bg_pool_utilization: percent, merge_queue_size: count, pool_size: count }
    owner: "clickwatch"
    labels: [P1, background, daily]
    notes: >-
      Чек-лист п.33. Объединённый пул мерджей и мутаций появился в ~22.6 (конверсия метрика/пул
      отличается в старых версиях). bg_pool_utilization = -1 при неизвестном размере пула.
      Переименования под реестр ClickWatch: bg_pool_pct -> bg_pool_utilization (№63),
      bg_tasks_active -> merge_queue_size (№62).

  - id: 34
    uid: "ch.background.mutation_merge_contention"
    title_en: "Mutation-Merge Contention"
    title_ru: "Конфликт мутаций и мерджей"
    group: background
    priority: P2
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.merges, system.mutations]
    interval: 15m
    query: |
      SELECT
        toUInt64((SELECT count() FROM system.merges WHERE is_mutation = 0))   AS running_merges,
        toUInt64((SELECT count() FROM system.mutations WHERE is_done = 0))    AS running_mutations,
        toUInt64((SELECT max(elapsed) FROM system.merges WHERE is_mutation = 1)) AS max_mutation_duration,
        if((SELECT count() FROM system.mutations WHERE is_done = 0) > 10
           AND (SELECT count() FROM system.merges WHERE is_mutation = 0) = 0, 1, 0) AS contention_flag
    thresholds:
      - { metric: contention_flag, op: gte, value: 1, severity: warning }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { contention_flag: count, running_merges: count, running_mutations: count,
                max_mutation_duration: seconds }
    owner: "clickwatch"
    labels: [P2, background, weekly]
    notes: >-
      Чек-лист п.34. Ноль мерджей при десятке активных мутаций - фоновой пул перегружен мутациями.
      max_mutation_duration - из merges WHERE is_mutation=1 (реестр №67): зависший мутационный
      merge блокирует партицию.

  # --------------------------------------------------------------------------
  # Блок G. Компоненты и интеграции (чек-лист 35-43)
  # --------------------------------------------------------------------------

  - id: 35
    uid: "ch.components.blob_storage"
    title_en: "Blob Storage Errors"
    title_ru: "Ошибки S3/blob storage"
    group: components
    priority: P2
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.blob_storage_log]
    since: "23.2"
    interval: 15m
    query: |
      SELECT
        toUInt64(countIf(error != ''))  AS blob_errors_hour,
        round(max(elapsed_microseconds) / 1000000, 1) AS max_blob_op_sec,
        toUInt64(sumIf(data_size, event_type = 'Read'))   AS s3_bytes_read,
        toUInt64(sumIf(data_size, event_type = 'Upload')) AS s3_bytes_written
      FROM system.blob_storage_log
      WHERE event_date >= today() - 1
        AND event_time >= now() - INTERVAL 1 HOUR
    thresholds:
      - { metric: blob_errors_hour, op: gte, value: 10, severity: warning }
      - { metric: max_blob_op_sec,  op: gte, value: 1,  severity: warning }
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { blob_errors_hour: count, max_blob_op_sec: seconds,
                s3_bytes_read: bytes, s3_bytes_written: bytes }
    owner: "clickwatch"
    labels: [P2, s3, daily]
    notes: >-
      Чек-лист п.35. Если хранение локальное, таблица пуста - правило просто "чисто".
      Таблица появилась в ~23.2. Трафик S3: s3_bytes_read = сумма data_size операций
      Read, s3_bytes_written = сумма data_size операций Upload (окно 1 ч; ноль операций
      за окно = честный ноль, не пробел). Длительность - elapsed_microseconds (в ранних
      23.x колонка называлась elapsed, там правило уйдёт в error_query, не задевая
      остальные правила).

  - id: 36
    uid: "ch.components.filesystem_cache"
    title_en: "Filesystem Cache Size"
    title_ru: "Размер файлового кэша"
    group: components
    priority: P3
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.filesystem_cache]
    since: "23.1"
    interval: 1h
    query: |
      SELECT toUInt64(coalesce(sum(file_size), 0)) AS cache_size_bytes
      FROM system.filesystem_cache
    thresholds:
      - { metric: cache_size_bytes, op: gte, value: 9000000000, severity: warning }
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { cache_size_bytes: bytes }
    owner: "clickwatch"
    labels: [P3, cache, weekly]
    notes: >-
      Чек-лист п.36. Порог 90% от лимита кэша 10 ГиБ по умолчанию; dba правит под фактический
      filesystem cache max_size. Если кэш не используется - результат 0 (правило "чисто").

  - id: 37
    uid: "ch.components.kafka_consumers"
    title_en: "Kafka Consumer Lag"
    title_ru: "Потребители Kafka"
    group: components
    priority: P3
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.kafka_consumers]
    since: "24.4"
    enabled: false
    interval: 15m
    query: |
      SELECT
        toUInt64(count()) AS consumers_active,
        countIf(last_used > now() - INTERVAL 5 MINUTE)  AS consumers_recent
      FROM system.kafka_consumers
    thresholds: []
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { consumers_active: count }
    owner: "clickwatch"
    labels: [P3, kafka, daily]
    notes: >-
      Чек-лист п.37. ВЫКЛЮЧЕНО по умолчанию: состав колонок system.kafka_consumers менялся
      в 24.x-25.x; dba проверяет DESCRIBE и включает правило (enabled: true) после уточнения
      запроса под свою версию. Таблица с ~24.4, в 23.x отсутствует.

  - id: 38
    uid: "ch.components.backups"
    title_en: "Backup Health"
    title_ru: "Состояние резервных копий"
    group: components
    priority: P3
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.backups]
    since: "22.7"
    interval: 1h
    query: |
      SELECT
        toUInt64(countIf(error != '')) AS failed_backups_24h,
        toUInt64(countIf(status = 'CREATING_BACKUP')) AS running_backups,
        toUInt64(maxIf(dateDiff('second', start_time, end_time), status != 'CREATING_BACKUP'))
                                                                                    AS backup_duration_sec
      FROM system.backups
      WHERE start_time >= now() - INTERVAL 24 HOUR
    thresholds:
      - { metric: failed_backups_24h, op: gte, value: 1, severity: warning }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { failed_backups_24h: count, running_backups: count, backup_duration_sec: seconds }
    owner: "clickwatch"
    labels: [P3, backup, weekly]
    notes: >-
      Чек-лист п.38. Применимо при использовании встроенного BACKUP/RESTORE;
      статусы ('CREATING_BACKUP' и др.) сверены для 23.x-25.x.
      backup_duration_sec = end_time - start_time (аналог elapsed реестра №12); идёт в SaaS
      для сравнения с типовой длительностью (порог 2x - SaaS).
      Источник остаётся system.backups (22.7+); system.backup_log (23.3+) - альтернатива.

  - id: 39
    uid: "ch.components.mv_refresh_errors"
    title_en: "Materialized View Refresh Failures"
    title_ru: "Сбои обновления MV"
    group: components
    priority: P3
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.query_log]
    interval: 1h
    query: |
      SELECT
        toUInt64(countIf(query ILIKE '%materialized%')) AS mv_errors_24h
      FROM system.query_log
      WHERE type = 'ExceptionWhileProcessing'
        AND event_date >= today() - 1
        AND event_time >= now() - INTERVAL 24 HOUR
    thresholds:
      - { metric: mv_errors_24h, op: gte, value: 1, severity: warning }
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { mv_errors_24h: count }
    owner: "clickwatch"
    labels: [P3, mv, weekly]
    notes: >-
      Чек-лист п.39. Эвристика по тексту запроса в трейсе исключений; в 24.x+ добавляется
      точное поле DependencyRefresh (дополнить запрос при 24.x+ по желанию dba). Тексты запросов
      в sample маскируются (redact_columns).

  - id: 40
    uid: "ch.components.schema_fingerprint"
    title_en: "Schema Drift"
    title_ru: "Отпечаток схемы"
    group: components
    priority: P3
    applies_to: [standalone, replicated]
    scope: saas
    tables: [system.columns]
    interval: 24h
    query: |
      SELECT
        hex(SHA256(toString(arraySort(groupArray(s))))) AS schema_fingerprint,
        toUInt64(count()) AS tables_tracked
      FROM
      (
        SELECT database, `table`, count() AS cnt, concat(database, '.', `table`, ':', toString(cnt)) AS s
        FROM system.columns
        GROUP BY database, `table`
      )
    thresholds: []
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { tables_tracked: count }
    owner: "clickwatch"
    labels: [P3, schema, weekly]
    notes: >-
      Чек-лист п.40. SaaS сравнивает отпечаток между нодами кластера и против эталонной версии.

  - id: 41
    uid: "ch.components.network_saturation"
    title_en: "Network Saturation"
    title_ru: "Насыщение сети"
    group: components
    priority: P3
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.metric_log]
    since: "22.0"
    interval: 15m
    query: |
      SELECT
        round((max(NetworkReceiveBytes) - min(NetworkReceiveBytes)) / 900 / 1048576, 1) AS recv_mbps,
        round((max(NetworkSendBytes) - min(NetworkSendBytes)) / 900 / 1048576, 1)       AS send_mbps,
        toUInt64(max(ProfileEvent.NetworkError) - min(ProfileEvent.NetworkError))       AS network_errors,
        round((max(ProfileEvent.InterserverSendBytes)
             - min(ProfileEvent.InterserverSendBytes)) / 900, 1)                        AS interserver_send_bytes,
        round((max(ProfileEvent.InterserverReceiveBytes)
             - min(ProfileEvent.InterserverReceiveBytes)) / 900, 1)                     AS interserver_receive_bytes
      FROM system.metric_log
      WHERE event_date >= today() - 1
        AND event_time >= now() - INTERVAL 15 MINUTE
        AND NetworkReceiveBytes > 0
    thresholds:
      - { metric: recv_mbps, op: gte, value: 500,  severity: warning }
      - { metric: recv_mbps, op: gte, value: 1000, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { recv_mbps: mbps, send_mbps: mbps, network_errors: count,
                interserver_send_bytes: mbps, interserver_receive_bytes: mbps }
    owner: "clickwatch"
    labels: [P3, network, weekly]
    notes: >-
      Чек-лист п.41. Дефолтные пороги под 10G-линк; dba правит под фактический интерфейс.
      Добавлены сетевые ошибки (реестр №98) и interserver-поток между шардами (№99-100),
      байт/с = дельта профилей за окно 15 мин.

  - id: 42
    uid: "ch.components.privileged_changes"
    title_en: "Privileged Changes"
    title_ru: "Привилегированные изменения (GRANT/USER)"
    group: components
    priority: P3
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.query_log]
    interval: 24h
    query: |
      SELECT toUInt64(countIf(query ILIKE 'grant %' OR query ILIKE 'alter user %' OR query ILIKE 'create user %'))
             AS privileged_queries_24h
      FROM system.query_log
      WHERE type = 'QueryStart'
        AND event_date >= today() - 1
        AND event_time >= now() - INTERVAL 24 HOUR
    thresholds:
      - { metric: privileged_queries_24h, op: gte, value: 5, severity: warning }
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { privileged_queries_24h: count }
    owner: "security@company"
    labels: [P3, security, weekly]
    notes: >-
      Чек-лист п.42. Индикатор нештатных действий с правами; SaaS коррелирует с session_log.

  - id: 43
    uid: "ch.components.growth_forecast"
    title_en: "Data Growth Forecast"
    title_ru: "Объёмы данных (прогноз пустого диска)"
    group: components
    priority: P3
    applies_to: [standalone, replicated]
    scope: saas
    tables: [system.tables]
    interval: 6h
    query: |
      SELECT
        toUInt64(sum(total_bytes))       AS total_bytes,
        toUInt64(count())                AS tables_count,
        hostname() AS hostname
      FROM system.tables
      WHERE total_bytes IS NOT NULL
    thresholds: []
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { total_bytes: bytes, tables_count: count }
    owner: "clickwatch"
    labels: [P3, capacity, weekly]
    notes: >-
      Чек-лист п.43. SaaS строит тренд по истории измерений и прогнозирует заполнение диска.

  # --------------------------------------------------------------------------
  # Расширение за пределами чек-листа (id 44-46, метрики реестра ClickWatch,
  # см. реестр метрик ClickWatch §10). Можно отключить локальным override (enabled: false).
  # --------------------------------------------------------------------------

  - id: 44
    uid: "ch.host.resources"
    title_en: "Host Resources (RAM/CPU/Load)"
    title_ru: "Ресурсы ноды (RAM/CPU/load)"
    group: components
    priority: P1
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.asynchronous_metrics]
    since: "20.13"
    interval: 5m
    query: |
      SELECT
        round((maxIf(v, m = 'OSMemoryTotal') - maxIf(v, m = 'OSMemoryAvailable')) * 100.0
              / nullIf(maxIf(v, m = 'OSMemoryTotal'), 0), 1)                    AS ram_used_pct,
        toUInt64(maxIf(v, m = 'OSMemoryAvailable'))                             AS ram_available,
        toUInt64(maxIf(v, m = 'OSMemoryTotal'))                                 AS ram_total,
        toUInt64(maxIf(v, m = 'OpenFileDescriptors'))                           AS open_file_descriptors,
        toUInt64(maxIf(v, m = 'PageCacheSize'))                                 AS page_cache_size,
        toUInt64(maxIf(v, m = 'Uptime'))                                        AS uptime_seconds,
        round(maxIf(v, m = 'LoadAverage1'), 2)                                  AS load_avg_1m,
        round(maxIf(v, m = 'LoadAverage5'), 2)                                  AS load_avg_5m,
        round(maxIf(v, m = 'LoadAverage15'), 2)                                 AS load_avg_15m,
        toUInt64(maxIf(v, m = 'ThreadingThreads'))                              AS threads_count,
        round(maxIf(v, m = 'ContextSwitchRate'), 1)                             AS context_switch_rate,
        toUInt64(maxIf(v, m = 'CPUUserTime'))                                   AS cpu_user,
        toUInt64(maxIf(v, m = 'CPUSystemTime'))                                 AS cpu_system
      FROM
      (
        SELECT metric AS m, value AS v
        FROM system.asynchronous_metrics
        WHERE metric IN ('OSMemoryTotal', 'OSMemoryAvailable', 'OpenFileDescriptors',
                         'PageCacheSize', 'Uptime', 'LoadAverage1', 'LoadAverage5',
                         'LoadAverage15', 'ThreadingThreads', 'ContextSwitchRate',
                         'CPUUserTime', 'CPUSystemTime')
      )
    thresholds:
      - { metric: ram_used_pct,  op: gte, value: 90, severity: warning }
      - { metric: ram_used_pct,  op: gte, value: 95, severity: critical }
      - { metric: load_avg_1m,   op: gte, value: 4,  severity: warning }
      - { metric: load_avg_1m,   op: gte, value: 8,  severity: critical }
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { ram_used_pct: percent, ram_available: bytes, ram_total: bytes, page_cache_size: bytes,
                uptime_seconds: seconds, threads_count: count,
                context_switch_rate: count, cpu_user: seconds, cpu_system: seconds }
    owner: "clickwatch"
    labels: [P1, host, daily]
    notes: >-
      Вне чек-листа. Покрывает критичные метрики реестра ClickWatch №19-21, 29, 31,
      35-44 (крупнейший пробел 43-пунктового набора - нет CPU/RAM/load).
      cpu_user/cpu_system - кумулятивные секунды; cpu_usage (rate) считает SaaS.
      Пороги load_avg_1m поднять на многоядерных нодах; open_file_descriptors - без
      порога (лимит ОС хоста неизвестен), контроль деградации дашбордом.

  - id: 45
    uid: "ch.gauges.core_counters"
    title_en: "Core Counters / Gauges Snapshot"
    title_ru: "Снимок счётчиков и gauge (поток для SaaS)"
    group: components
    priority: P3
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.events, system.metrics, system.asynchronous_metrics]
    since: "20.4"
    interval: 5m
    query: |
      WITH
        ev AS
        (
          SELECT
            maxIf(value, event = 'Query')                          AS ev_query,
            maxIf(value, event = 'SelectedRows')                   AS ev_selected_rows,
            maxIf(value, event = 'InsertedRows')                   AS ev_inserted_rows,
            maxIf(value, event = 'FailedQuery')                    AS ev_failed_query,
            maxIf(value, event = 'FailedSelectQuery')              AS ev_failed_select_query,
            maxIf(value, event = 'FailedInsertQuery')              AS ev_failed_insert_query,
            maxIf(value, event = 'CancelledQuery')                 AS ev_cancelled_query,
            maxIf(value, event = 'OutOfMemory')                    AS ev_out_of_memory,
            maxIf(value, event = 'ReadBytes')                      AS ev_read_bytes,
            maxIf(value, event = 'WrittenBytes')                   AS ev_written_bytes,
            maxIf(value, event = 'ReadRows')                       AS ev_read_rows,
            maxIf(value, event = 'ResultRows')                     AS ev_result_rows,
            maxIf(value, event = 'ReadBytesCompressed')            AS ev_read_bytes_compressed,
            maxIf(value, event = 'NetworkReceiveBytes')            AS ev_network_receive_bytes,
            maxIf(value, event = 'NetworkSendBytes')               AS ev_network_send_bytes,
            maxIf(value, event = 'NetworkReceiveTimeout')          AS ev_network_receive_timeout,
            maxIf(value, event = 'NetworkSendTimeout')             AS ev_network_send_timeout,
            maxIf(value, event = 'NetworkError')                   AS ev_network_error,
            maxIf(value, event = 'InterserverSendBytes')           AS ev_interserver_send_bytes,
            maxIf(value, event = 'InterserverReceiveBytes')        AS ev_interserver_receive_bytes,
            maxIf(value, event = 'MarkCacheHits')                  AS ev_mark_cache_hits,
            maxIf(value, event = 'MarkCacheMisses')                AS ev_mark_cache_misses,
            maxIf(value, event = 'UncompressedCacheHits')          AS ev_uncompressed_cache_hits,
            maxIf(value, event = 'UncompressedCacheMisses')        AS ev_uncompressed_cache_misses,
            maxIf(value, event = 'CompileFunction')                AS ev_compile_function,
            maxIf(value, event = 'CompressedReadBufferBlocks')     AS ev_compressed_read_buffer_blocks,
            maxIf(value, event = 'ReplicaPartMerges')              AS ev_replica_part_merges,
            maxIf(value, event = 'ReplicatedPartMerges')           AS ev_replicated_part_merges,
            maxIf(value, event = 'ReplicatedPartFetches')          AS ev_replicated_part_fetches,
            maxIf(value, event = 'ZooKeeperHardwareExceptions')    AS ev_zk_hardware_exceptions,
            maxIf(value, event = 'ZooKeeperUserExceptions')        AS ev_zk_user_exceptions,
            maxIf(value, event = 'DistributedSendTimeoutCount')    AS ev_distributed_send_timeout
          FROM system.events
        ),
        mg AS
        (
          SELECT
            maxIf(value, metric = 'MarkCacheBytes')                AS g_mark_cache_bytes,
            maxIf(value, metric = 'UncompressedCacheBytes')        AS g_uncompressed_cache_bytes,
            maxIf(value, metric = 'PageCacheSize')                 AS g_page_cache_size,
            maxIf(value, metric = 'MMappedFileCount')              AS g_mmapped_files,
            maxIf(value, metric = 'MMappedFileBytes')              AS g_mmapped_file_size,
            maxIf(value, metric = 'DistributedDirectoryCount')     AS g_distributed_directories,
            maxIf(value, metric = 'DiskSpaceUsed')                 AS g_disk_space_used,
            maxIf(value, metric = 'ZooKeeperConnections')          AS g_zk_connections,
            maxIf(value, metric = 'ThreadingThreads')              AS g_threads_count
          FROM system.asynchronous_metrics
        ),
        mt AS
        (
          SELECT
            maxIf(value, metric = 'InterserverConnections')        AS g_interserver_connections,
            maxIf(value, metric = 'HTTPConnection')                AS g_http_connections,
            maxIf(value, metric = 'TCPConnection')                 AS g_tcp_connections,
            maxIf(value, metric = 'DistributedSend')               AS g_distributed_send,
            maxIf(value, metric = 'BackgroundSchedulePoolTask')    AS g_bg_schedule_pool,
            maxIf(value, metric = 'BackgroundMovePoolTask')        AS g_bg_move_pool
          FROM system.metrics
        )
      SELECT ev.*, mg.*, mt.* FROM ev, mg, mt
    thresholds: []
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { ev_query: count, ev_selected_rows: count, ev_inserted_rows: count,
                ev_failed_query: count, ev_failed_select_query: count, ev_failed_insert_query: count,
                ev_cancelled_query: count, ev_out_of_memory: count, ev_read_bytes: bytes,
                ev_written_bytes: bytes, ev_read_rows: count, ev_result_rows: count,
                ev_read_bytes_compressed: bytes, ev_network_receive_bytes: bytes, ev_network_send_bytes: bytes,
                ev_network_receive_timeout: count, ev_network_send_timeout: count, ev_network_error: count,
                ev_interserver_send_bytes: bytes, ev_interserver_receive_bytes: bytes,
                ev_mark_cache_hits: count, ev_mark_cache_misses: count,
                ev_uncompressed_cache_hits: count, ev_uncompressed_cache_misses: count,
                ev_compile_function: count, ev_compressed_read_buffer_blocks: count,
                ev_replica_part_merges: count, ev_replicated_part_merges: count,
                ev_replicated_part_fetches: count, ev_zk_hardware_exceptions: count,
                ev_zk_user_exceptions: count, ev_distributed_send_timeout: count,
                g_mark_cache_bytes: bytes, g_uncompressed_cache_bytes: bytes, g_page_cache_size: bytes,
                g_mmapped_files: count, g_mmapped_file_size: bytes, g_distributed_directories: count,
                g_disk_space_used: bytes, g_zk_connections: count, g_threads_count: count,
                g_interserver_connections: count, g_http_connections: count, g_tcp_connections: count,
                g_distributed_send: count, g_bg_schedule_pool: count, g_bg_move_pool: count }
    owner: "clickwatch"
    labels: [P3, telemetry, daily]
    notes: >-
      Вне чек-листа. Снимок кумулятивных счётчиков (rate/delta и hit-rate считает SaaS -
      как бэкенд ClickWatch; реестр №14-15, 17-18, 53-56, 83, 85-87, 95, 106-112).
      0 для отсутствующего в версии события - норма, ошибки не порождает.

