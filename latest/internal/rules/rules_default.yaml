  - id: 47
    uid: "ch.parts.duplicates"
    title_en: "Duplicated Parts"
    title_ru: "Дубликаты частей"
    group: parts_disk
    priority: P3
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.parts]
    since: "21.8"
    interval: 15m
    query: |
      SELECT
        toUInt64(sum(dup.extras))    AS duplicate_parts,
        toUInt64(count())            AS duplicate_groups,
        toUInt64(sum(dup.total_bytes)) AS duplicate_parts_bytes
      FROM
      (
        SELECT database, table, hash_of_all_files,
               count() - 1 AS extras,
               sum(bytes_on_disk) AS total_bytes
        FROM system.parts
        WHERE active = 1
          AND database NOT IN ('system', 'INFORMATION_SCHEMA', 'information_schema')
        GROUP BY database, table, hash_of_all_files
        HAVING count() > 1
      ) AS dup
    thresholds:
      - { metric: duplicate_parts, op: gte, value: 1,  severity: warning }
      - { metric: duplicate_parts, op: gte, value: 50, severity: critical }
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { duplicate_parts: count, duplicate_groups: count, duplicate_parts_bytes: bytes }
    owner: "clickwatch"
    labels: [P3, parts, daily]
    notes: >-
      Вне чек-листа (расширение п.8). Закрывает m_duplicated_parts коллектора r620:
      одинаковые по hash_of_all_files активные части одной таблицы = лишние копии
      (после восстановления из бэкапа, ручных copy/data-операций, разъезда реплик).
      Хеш включает имена файлов внутри части, разные части с равным хешем -
      фактически идентичные данные. Пустой выбор = 0 (полная агрегация, не NULL).
      duplicate_groups - число групп дубликатов, duplicate_parts_bytes - суммарный
      объём всех частей, входящих в такие группы.

  - id: 48
    uid: "ch.state.settings_values"
