# ============================================================================
# ch-agent - встроенный (embedded) каталог правил мониторинга ClickHouse
# Слой 1 из 3: //go:embed (этот файл компилируется в бинарник).
# dataset_version: 0 - базовый fallback; слой SaaS всегда новее.
# Формат полей и механика слияния слоёв: см. описание формата правил (в README репозитория)
# Идентификаторы: uid - стабильный ключ (не менять никогда);
#                 id  - номер пункта администраторского чек-листа ClickWatch
# Правила id 44-46 - расширение за пределами чек-листа (реестр метрик ClickWatch:
# host-телеметрия, снимок счётчиков, статус Keeper-соединения).
# Все запросы - ТОЛЬКО к локальным системным таблицам ноды (без clusterAllReplicas).
# Кросс-нодовые сравнения делает SaaS (scope: saas).
# ============================================================================

schema_version: 1
dataset_uid: "ch-monitor-rules"
dataset_version: 0
# hash пересчитывается пайплайном сборки и агентом после embed:
dataset_hash: "sha256:computed_at_build"
released_at: "2026-11-04"
channel: stable
min_agent_version: "1.2.0"

defaults:
  interval: 5m
  jitter: 30s
  execution_timeout: 15s
  max_rows_per_rule: 10
  max_cell_bytes: 4096
  query_settings: "max_threads=2"

rules:
  # --------------------------------------------------------------------------
  # Блок A. Мутации и репликация (чек-лист 1-6)
  # --------------------------------------------------------------------------

  - id: 1
    uid: "ch.mutations.active_summary"
    title_en: "Active Mutations Summary"
    title_ru: "Активные мутации (сводка по ноде)"
    group: mutations_replication
    priority: P1
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.mutations, system.merges]
    since: "20.4"
    interval: 5m
    query: |
      SELECT
        countIf(NOT is_done AND create_time >= now() - INTERVAL 1 DAY)          AS active_mutations_24h,
        round(maxIf((now() - create_time) / 3600, NOT is_done), 1)              AS oldest_running_hours,
        maxIf(parts_to_do, NOT is_done)                                         AS max_parts_to_do,
        toUInt64((SELECT count() FROM system.merges WHERE is_mutation = 1))     AS running_merges_control
      FROM system.mutations
    thresholds:
      - { metric: active_mutations_24h, op: gte, value: 1,  severity: warning }
      - { metric: active_mutations_24h, op: gte, value: 10, severity: critical }
      - { metric: oldest_running_hours, op: gte, value: 6,  severity: warning }
      - { metric: oldest_running_hours, op: gte, value: 12, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { oldest_running_hours: hours, max_parts_to_do: count, running_merges_control: count }
    owner: "clickwatch"
    labels: [P1, mutations, daily]
    notes: >-
      Чек-лист п.1. Число незавершённых мутаций за последние 24 ч (окно свежести),
      возраст самой старшей и объём оставшейся работы (parts_to_do).
      running_merges_control - контрольная колонка из merges (is_mutation=1, семантика №68 реестра
      ClickWatch): очередь мутаций (system.mutations) и исполняющиеся мутации (merges) различаются,
      обе величины нужны (реестр метрик ClickWatch §12.4).

  - id: 2
    uid: "ch.mutations.failed"
    title_en: "Failed Mutations"
    title_ru: "Падающие мутации"
    group: mutations_replication
    priority: P1
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.mutations]
    since: "20.4"
    interval: 5m
    query: |
      SELECT
        count()                AS failed_mutations,
        toUInt64(max(latest_fail_count)) AS fail_retries
      FROM system.mutations
      WHERE is_done = 0
        AND length(latest_fail_reason) > 0
        AND create_time >= now() - INTERVAL 1 DAY
    thresholds:
      - { metric: failed_mutations, op: gte, value: 1, severity: critical }
      - { metric: fail_retries,     op: gte, value: 3, severity: warning }
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { failed_mutations: count, fail_retries: count }
    owner: "clickwatch"
    labels: [P1, mutations, daily]
    notes: >-
      Чек-лист п.2. Упавшая мутация повторяется бесконечно и мешает удалению старых частей.
      В 25.5+ часть лёгких DELETE/UPDATE (patch parts) в system.mutations не видна - правило
      следует дополнять данными о lightweight-операциях на стороне SaaS.

  - id: 3
    uid: "ch.mutations.replica_skew"
    title_en: "Replication Skew on Mutations"
    title_ru: "Расхождение реплик по мутациям"
    group: mutations_replication
    priority: P1
    applies_to: [replicated]
    scope: saas
    tables: [system.mutations]
    since: "20.4"
    interval: 15m
    max_rows_per_rule: 50
    query: |
      SELECT
        database, `table`, mutation_id, is_done, parts_to_do,
        hostname() AS hostname
      FROM system.mutations
      WHERE create_time >= now() - INTERVAL 1 DAY
    thresholds: []
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { parts_to_do: count }
    owner: "clickwatch"
    labels: [P1, mutations, daily]
    notes: >-
      Чек-лист п.3. Покрытие мутаций по репликам сравнивается на стороне SaaS:
      узел-аутсайдер по is_done/parts_to_do свидетельствует об отставании реплики.

  - id: 4
    uid: "ch.replication_queue.backlog"
    title_en: "Replication Queue Backlog"
    title_ru: "Backlog очереди репликации (MUTATE_PART)"
    group: mutations_replication
    priority: P1
    applies_to: [replicated]
    scope: node
    tables: [system.replication_queue, system.replicas]
    since: "20.4"
    interval: 2m
    query: |
      SELECT
        countIf(type = 'MUTATE_PART')                                AS mutate_tasks,
        minIf(intDiv(now() - create_time, 60), type = 'MUTATE_PART') AS oldest_mutate_min,
        toUInt64((SELECT max(queue_size) FROM system.replicas))      AS replicas_max_queue_size
      FROM system.replication_queue
      WHERE create_time >= now() - INTERVAL 1 DAY
    thresholds:
      - { metric: mutate_tasks,     op: gte, value: 100, severity: warning }
      - { metric: mutate_tasks,     op: gte, value: 500, severity: critical }
      - { metric: oldest_mutate_min, op: gte, value: 30,  severity: warning }
      - { metric: oldest_mutate_min, op: gte, value: 120, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { mutate_tasks: count, oldest_mutate_min: minutes, replicas_max_queue_size: count }
    owner: "clickwatch"
    labels: [P1, mutations, daily]
    notes: >-
      Чек-лист п.4. Копящиеся задачи MUTATE_PART означают, что реплика не справляется.

  - id: 5
    uid: "ch.replicas.queue_imbalance"
    title_en: "Queue Load Imbalance"
    title_ru: "Дисбаланс очередей реплик"
    group: mutations_replication
    priority: P1
    applies_to: [replicated]
    scope: saas
    tables: [system.replicas]
    interval: 15m
    max_rows_per_rule: 50
    query: |
      SELECT
        database, `table`, queue_size, inserts_in_queue, merges_in_queue,
        part_mutations_in_queue, hostname() AS hostname
      FROM system.replicas
    thresholds: []
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { queue_size: count, inserts_in_queue: count, merges_in_queue: count,
                part_mutations_in_queue: count }
    owner: "clickwatch"
    labels: [P1, replication, daily]
    notes: >-
      Чек-лист п.5. SaaS считается max/min queue_size между нодами кластера (> 5x - тревога).

  - id: 6
    uid: "ch.mutations.pileup"
    title_en: "Mutation Pile-up vs Limits"
    title_ru: "Накопление мутаций против лимитов"
    group: mutations_replication
    priority: P1
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.mutations]
    since: "20.4"
    interval: 15m
    query: |
      SELECT
        max(cnt)      AS max_active_muts_per_table,
        toUInt64(sum(cnt)) AS total_active_muts
      FROM
      (
        SELECT database, `table`, count() AS cnt
        FROM system.mutations
        WHERE is_done = 0
        GROUP BY database, `table`
      )
    thresholds:
      - { metric: max_active_muts_per_table, op: gte, value: 10, severity: warning }
      - { metric: max_active_muts_per_table, op: gte, value: 40, severity: critical }
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { max_active_muts_per_table: count }
    owner: "clickwatch"
    labels: [P1, mutations, daily]
    notes: >-
      Чек-лист п.6. Приближение к max_part_mutations (default 50) тормозит вставки.

  # --------------------------------------------------------------------------
  # Блок B. Части и диск (чек-лист 7-11)
  # --------------------------------------------------------------------------

  - id: 7
    uid: "ch.parts.too_many_parts"
    title_en: "Too Many Parts"
    title_ru: "Too many parts и backpressure вставок"
    group: parts_disk
    priority: P2
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.parts, system.asynchronous_metrics]
    since: "22.3"
    interval: 5m
    query: |
      SELECT
        coalesce(max(cnt), 0)   AS max_parts_per_partition,
        coalesce(max(tcnt), 0)  AS max_parts_per_table,
        toUInt64(sum(tcnt))     AS total_parts,
        toUInt64((SELECT maxIf(value, metric = 'MaxPartCountForPartition')
                  FROM system.asynchronous_metrics)) AS too_many_parts_count,
        toUInt64((SELECT maxIf(value, metric = 'PartsToDelayInsert')
                  FROM system.asynchronous_metrics)) AS parts_to_delay_inserts,
        toUInt64((SELECT maxIf(value, metric = 'PartsToThrowInsert')
                  FROM system.asynchronous_metrics)) AS parts_to_throw_inserts
      FROM
      (
        SELECT database, `table`,
               count() AS tcnt,
               max(pc) AS cnt
        FROM
        (
          SELECT database, `table`, partition, count() AS pc
          FROM system.parts
          WHERE active
          GROUP BY database, `table`, partition
        )
        GROUP BY database, `table`
      )
    thresholds:
      - { metric: max_parts_per_partition, op: gte, value: 100, severity: warning }
      - { metric: max_parts_per_partition, op: gte, value: 200, severity: critical }
      - { metric: too_many_parts_count,    op: gte, value: 200, severity: warning }
      - { metric: too_many_parts_count,    op: gte, value: 500, severity: critical }
      - { metric: parts_to_delay_inserts,  op: gte, value: 1,   severity: warning }
      - { metric: parts_to_throw_inserts,  op: gte, value: 1,   severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { max_parts_per_partition: count, max_parts_per_table: count, total_parts: count,
                too_many_parts_count: count, parts_to_delay_inserts: count, parts_to_throw_inserts: count }
    owner: "clickwatch"
    labels: [P2, parts, daily]
    notes: >-
      Чек-лист п.7. Прямой тормоз/блокировка INSERT; точный предел зависит от настроек мерджей.
      Добавлены асинхронные метрики backpressure (PartsToDelayInsert/PartsToThrowInsert, 22.x+,
      реестр №64-66) и суммарные парты. С 23.6 дефолт too_many_parts = 1000, поэтому порог
      200 частей в партиции - раннее предупреждение. since 22.3: на 21.x правило
      skipped_unsupported (метрики delay/throw отсутствуют).

  - id: 8
    uid: "ch.parts.inactive_garbage"
    title_en: "Inactive Parts / GC Lag"
    title_ru: "Неактивные части (мусор)"
    group: parts_disk
    priority: P2
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.parts]
    interval: 15m
    query: |
      SELECT
        round(coalesce(max(ratio), 0), 3)                 AS max_stale_ratio,
        toUInt64(coalesce(sum(stale_bytes), 0))           AS stale_bytes_total,
        round(coalesce(max(stale_age_sec), 0) / 3600, 1)  AS oldest_inactive_hours,
        toUInt64(coalesce(sum(inactive_cnt), 0))          AS inactive_parts
      FROM
      (
        SELECT
          database, `table`,
          countIf(NOT active)                                    AS inactive_cnt,
          if(sumIf(bytes_on_disk, active) > 0,
             sumIf(bytes_on_disk, NOT active) / sumIf(bytes_on_disk, active), 0) AS ratio,
          sumIf(bytes_on_disk, NOT active)                       AS stale_bytes,
          maxIf(now() - modification_time, NOT active)           AS stale_age_sec
        FROM system.parts
        GROUP BY database, `table`
        HAVING stale_bytes > 0
      )
    thresholds:
      - { metric: max_stale_ratio,     op: gte, value: 0.10,  severity: warning }
      - { metric: max_stale_ratio,     op: gte, value: 0.25,  severity: critical }
      - { metric: stale_bytes_total,   op: gte, value: 100000000000, severity: warning }
      - { metric: oldest_inactive_hours, op: gte, value: 24, severity: warning }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { max_stale_ratio: ratio, stale_bytes_total: bytes, oldest_inactive_hours: hours, inactive_parts: count }
    owner: "clickwatch"
    labels: [P2, parts, disk, daily]
    notes: >-
      Чек-лист п.8. Неактивные части существуют до завершения всех мутаций/мерджей и
      долгих SELECT; их рост - следствие зависших мутаций или долгих чтений.

  - id: 9
    uid: "ch.disks.free_space"
    title_en: "Disk Free Space"
    title_ru: "Свободное место на дисках"
    group: parts_disk
    priority: P1
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.disks]
    since: "22.5"
    interval: 2m
    query: |
      SELECT
        round(sum(used_space) * 100.0 / nullIf(sum(total_space), 0), 1)  AS disk_used_pct,
        toUInt64(sum(used_space))                                        AS disk_used,
        toUInt64(sum(total_space))                                       AS disk_total,
        round(min(free_space * 100.0 / total_space), 1)                  AS min_free_percent,
        toUInt64(min(free_space))                                        AS min_free_bytes,
        toUInt64(sumIf(used_space, type = 's3'))                         AS s3_disk_used,
        toUInt64(sumIf(free_space, type = 's3'))                         AS s3_disk_free,
        toUInt64(sumIf(total_space, type = 's3'))                        AS s3_disk_total,
        round(sumIf(used_space, type = 's3') * 100.0
              / nullIf(sumIf(total_space, type = 's3'), 0), 1)           AS s3_used_pct,
        toUInt64(max(keep_free_space))                                   AS keep_free_space
      FROM system.disks
      WHERE total_space > 0
    thresholds:
      - { metric: min_free_percent, op: lt, value: 25, severity: warning }
      - { metric: min_free_percent, op: lt, value: 10, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { disk_used_pct: percent, disk_used: bytes, disk_total: bytes, min_free_percent: percent,
                min_free_bytes: bytes, s3_disk_used: bytes, s3_disk_free: bytes, s3_disk_total: bytes,
                s3_used_pct: percent, keep_free_space: bytes }
    owner: "clickwatch"
    labels: [P1, disk, daily]
    notes: >-
      Чек-лист п.9. Мутации удваивают объём на время переписывания; в 25.2+ вставки
      учитывают брони (min_free_disk_bytes_to_perform_insert).
      Добавлены S3-колонки (реестр №49-52); нет S3 дисков - NULL, это норма.
      since 22.5: колонка type/диски S3 появились в 22.x.

  - id: 10
    uid: "ch.disks.io_saturation"
    title_en: "Disk I/O Saturation"
    title_ru: "Насыщение диска по I/O"
    group: parts_disk
    priority: P2
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.metric_log]
    interval: 15m
    query: |
      SELECT
        round((max(ProfileEvent.OSDiskReadBytes) - min(ProfileEvent.OSDiskReadBytes))
              / 900 / 1048576, 1) AS read_mbps,
        round((max(ProfileEvent.OSDiskWriteBytes) - min(ProfileEvent.OSDiskWriteBytes))
              / 900 / 1048576, 1)  AS write_mbps,
        round((max(ProfileEvent.ReadBufferFromFileDescriptorRead)
             - min(ProfileEvent.ReadBufferFromFileDescriptorRead)) / 900, 1)   AS disk_iops_read,
        round((max(ProfileEvent.WriteBufferFromFileDescriptorWrite)
             - min(ProfileEvent.WriteBufferFromFileDescriptorWrite)) / 900, 1) AS disk_iops_write
      FROM system.metric_log
      WHERE event_date >= today() - 1
        AND event_time >= now() - INTERVAL 15 MINUTE
        AND (ProfileEvent.OSDiskReadBytes > 0 OR ProfileEvent.OSDiskWriteBytes > 0)
    thresholds:
      - { metric: read_mbps,  op: gte, value: 400, severity: warning }
      - { metric: read_mbps,  op: gte, value: 800, severity: critical }
      - { metric: write_mbps, op: gte, value: 400, severity: warning }
      - { metric: write_mbps, op: gte, value: 800, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { read_mbps: mbps, write_mbps: mbps, disk_iops_read: count, disk_iops_write: count }
    owner: "clickwatch"
    labels: [P2, disk, io, daily]
    notes: >-
      Чек-лист п.10. Пороги дефолтные под NVMe ~ 1 ГБ/с; dba должен привести к профилю своих дисков.
      Требуется включённый metric_log; агрегат по окну 15 мин с шагом metric_log (обычно 60с).
      IOPS считаются из ProfileEvents ReadBufferFromFileDescriptorRead/Write (реестр №55-56);
      counter-дубль остаётся в снимке ch.gauges.core_counters.

  - id: 11
    uid: "ch.parts.churn"
    title_en: "High Part Churn"
    title_ru: "Скорость появления новых частей"
    group: parts_disk
    priority: P2
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.part_log, system.parts]
    interval: 15m
    query: |
      SELECT
        round((SELECT countIf(event_type = 'NewPart' AND event_time >= now() - INTERVAL 1 HOUR)
               FROM system.part_log) / 60.0, 2)                                      AS new_parts_per_min,
        toUInt64(coalesce((SELECT avgIf(bytes_on_disk, active AND level = 0)
               FROM system.parts), 0))                                                AS avg_new_part_bytes,
        toUInt64((SELECT round(avg(bytes_on_disk)) FROM system.parts WHERE active))   AS avg_part_size
    thresholds:
      - { metric: new_parts_per_min, op: gte, value: 5,  severity: warning }
      - { metric: new_parts_per_min, op: gte, value: 20, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { new_parts_per_min: count, avg_new_part_bytes: bytes, avg_part_size: bytes }
    owner: "clickwatch"
    labels: [P2, parts, insert, daily]
    notes: >-
      Чек-лист п.11. Дробный поток маленьких частей давит фоновый пул и мешает мутациям.

  # --------------------------------------------------------------------------
  # Блок C. Запросы и нагрузка (чек-лист 12-17)
  # --------------------------------------------------------------------------

  - id: 12
    uid: "ch.queries.long_selects"
    title_en: "Long-Running Queries"
    title_ru: "Длинные выполняющиеся запросы"
    group: queries_load
    priority: P2
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.processes, system.query_log, system.metrics]
    interval: 5m
    query: |
      SELECT
        toUInt64(countIf(elapsed > 900)) AS long_selects,
        toUInt64(count())                AS running_queries,
        toUInt64((SELECT max(value) FROM system.metrics WHERE metric = 'Query')
               + (SELECT max(value) FROM system.metrics WHERE metric = 'InsertQuery'))
                                                                          AS query_concurrency,
        toUInt64((SELECT quantile(0.95)(query_duration_ms) FROM system.query_log
                  WHERE type = 'QueryFinish' AND event_date >= today() - 1
                    AND event_time >= now() - INTERVAL 1 HOUR))           AS query_p95_ms,
        toUInt64((SELECT quantile(0.95)(query_duration_ms) FROM system.query_log
                  WHERE type = 'QueryFinish' AND query ILIKE 'SELECT%'
                    AND event_date >= today() - 1
                    AND event_time >= now() - INTERVAL 1 HOUR))           AS select_p95_ms
      FROM system.processes
    thresholds:
      - { metric: long_selects,   op: gte, value: 5,   severity: warning }
      - { metric: long_selects,   op: gte, value: 20,  severity: critical }
      - { metric: running_queries, op: gte, value: 200, severity: warning }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { long_selects: count, running_queries: count, query_concurrency: count,
                query_p95_ms: ms, select_p95_ms: ms }
    owner: "clickwatch"
    labels: [P2, queries, daily]
    notes: >-
      Чек-лист п.12. Длинные чтения удерживают старые части и мешают GC после мутаций.
      Добавлены p95 запросов/SELECT за окно 1ч (реестр №3, №7) и конкурентность (№12).
      Фильтр SELECT по тексту запроса - эвристика; окно пусто при log_queries=0.

  - id: 13
    uid: "ch.queries.exceptions"
    title_en: "Query Exceptions"
    title_ru: "Ошибки запросов"
    group: queries_load
    priority: P2
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.query_log, system.events]
    interval: 15m
    query: |
      SELECT
        toUInt64(countIf(type = 'ExceptionWhileProcessing')) AS exceptions_hour,
        toUInt64((SELECT sumIf(value, event IN ('FailedQuery', 'FailedSelectQuery', 'FailedInsertQuery'))
                  FROM system.events)) AS query_errors_count
      FROM system.query_log
      WHERE event_date >= today() - 1
        AND event_time >= now() - INTERVAL 1 HOUR
    thresholds:
      - { metric: exceptions_hour, op: gte, value: 10, severity: warning }
      - { metric: exceptions_hour, op: gte, value: 50, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { exceptions_hour: count, query_errors_count: count }
    owner: "clickwatch"
    labels: [P2, queries, errors, daily]
    notes: >-
      Чек-лист п.13. Требуется включённый query_log. Стабильно высокие ошибки - проблема ETL/cron.
      query_errors_count - кумулятивный счётчик system.events (реестр №5); rate/delta считает
      SaaS по точкам агента.

  - id: 14
    uid: "ch.queries.cancelled"
    title_en: "Cancelled Queries"
    title_ru: "Отменённые запросы"
    group: queries_load
    priority: P3
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.query_log, system.events]
    interval: 15m
    query: |
      SELECT
        toUInt64(countIf(exception_code = 394)) AS cancelled_hour,
        toUInt64((SELECT maxIf(value, event = 'CancelledQuery') FROM system.events))
                                                     AS cancelled_queries
      FROM system.query_log
      WHERE event_date >= today() - 1
        AND event_time >= now() - INTERVAL 1 HOUR
    thresholds:
      - { metric: cancelled_hour, op: gte, value: 50, severity: warning }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { cancelled_hour: count, cancelled_queries: count }
    owner: "clickwatch"
    labels: [P3, queries, weekly]
    notes: >-
      Чек-лист п.14. Рост отмен - признак перегрузки или kill-спама снаружи.
      cancelled_queries - кумулятивный счётчик из system.events (реестр №6).

  - id: 15
    uid: "ch.queries.insert_latency"
    title_en: "Slow Insert Latency"
    title_ru: "Задержка вставок"
    group: queries_load
    priority: P2
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.part_log, system.query_log]
    interval: 15m
    query: |
      SELECT
        toUInt64(quantile(0.99)(duration_ms)) AS p99_insert_ms,
        toUInt64(count())                     AS inserts_hour,
        toUInt64((SELECT quantile(0.95)(query_duration_ms) FROM system.query_log
                  WHERE type = 'QueryFinish' AND query ILIKE 'INSERT%'
                    AND event_date >= today() - 1
                    AND event_time >= now() - INTERVAL 1 HOUR)) AS insert_p95_ms
      FROM system.part_log
      WHERE event_type = 'NewPart'
        AND event_date >= today() - 1
        AND event_time >= now() - INTERVAL 1 HOUR
    thresholds:
      - { metric: p99_insert_ms, op: gte, value: 1000, severity: warning }
      - { metric: p99_insert_ms, op: gte, value: 5000, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { p99_insert_ms: ms, inserts_hour: count, insert_p95_ms: ms }
    owner: "clickwatch"
    labels: [P2, insert, daily]
    notes: >-
      Чек-лист п.15. Медленные вставки порождают много мелких частей; в 25.x не путать
      отказ вставки по свободному месту (min_free_disk_ratio_to_perform_insert) с перегрузкой.
      insert_p95_ms - из query_log (реестр №8); вставка по тексту запроса - эвристика.

  - id: 16
    uid: "ch.queries.user_imbalance"
    title_en: "User Workload Imbalance"
    title_ru: "Дисбаланс пользователей"
    group: queries_load
    priority: P3
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.query_log]
    interval: 1h
    query: |
      WITH q AS
      (
        SELECT user, count() AS cnt
        FROM system.query_log
        WHERE type = 'QueryFinish'
          AND event_date >= today() - 1
          AND event_time >= now() - INTERVAL 1 HOUR
        GROUP BY user
      )
      SELECT
        (SELECT user FROM q ORDER BY cnt DESC LIMIT 1) AS top_user,
        if((SELECT sum(cnt) FROM q) > 0,
           round((SELECT max(cnt) FROM q) * 100.0 / (SELECT sum(cnt) FROM q), 1), 0) AS top_user_share_pct,
        toUInt64((SELECT sum(cnt) FROM q)) AS total_queries_hour
    thresholds:
      - { metric: top_user_share_pct, op: gte, value: 50, severity: warning }
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { top_user_share_pct: percent, total_queries_hour: count }
    owner: "clickwatch"
    labels: [P3, queries, users, weekly]
    notes: >-
      Чек-лист п.16. Один пользователь, потребляющий более половины нагрузки за час.

  - id: 17
    uid: "ch.queries.throughput_baseline"
    title_en: "Throughput Baseline Drift"
    title_ru: "Скользящий профиль нагрузки (базовая линия)"
    group: queries_load
    priority: P3
    applies_to: [standalone, replicated]
    scope: saas
    tables: [system.query_log, system.events]
    interval: 15m
    query: |
      SELECT
        round(count() / 3600.0, 2)               AS qps_last_hour,
        toUInt64(count())                        AS queries_last_hour,
        toUInt64(sumIf(read_rows, type = 'QueryFinish')) AS read_rows_hour,
        toUInt64((SELECT quantile(0.5)(query_duration_ms) FROM system.query_log
                  WHERE type = 'QueryFinish' AND event_date >= today() - 1
                    AND event_time >= now() - INTERVAL 1 HOUR))  AS query_p50_ms,
        toUInt64((SELECT quantile(0.99)(query_duration_ms) FROM system.query_log
                  WHERE type = 'QueryFinish' AND event_date >= today() - 1
                    AND event_time >= now() - INTERVAL 1 HOUR))  AS query_p99_ms,
        toUInt64((SELECT maxIf(value, event = 'Query')        FROM system.events)) AS counter_query,
        toUInt64((SELECT maxIf(value, event = 'SelectedRows') FROM system.events)) AS counter_selected_rows,
        toUInt64((SELECT maxIf(value, event = 'InsertedRows') FROM system.events)) AS counter_inserted_rows,
        hostname() AS hostname
      FROM system.query_log
      WHERE event_date >= today() - 1
        AND event_time >= now() - INTERVAL 1 HOUR
    thresholds: []
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { qps_last_hour: count, read_rows_hour: count, query_p50_ms: ms, query_p99_ms: ms,
                counter_query: count, counter_selected_rows: count, counter_inserted_rows: count }
    owner: "clickwatch"
    labels: [P3, queries, weekly]
    notes: >-
      Чек-лист п.17. Сравнение с медианой прошлых недель делает SaaS (scope: saas).
      Добавлены p50/p99 (реестр №2, №4) и кумулятивные счётчики Query/SelectedRows/InsertedRows
      (rate/дельты SaaS считает по точкам).

  # --------------------------------------------------------------------------
  # Блок D. Память и процессы (чек-лист 18-21)
  # --------------------------------------------------------------------------

  - id: 18
    uid: "ch.memory.query_limits"
    title_en: "Query Memory Limits / OOM"
    title_ru: "Лимиты памяти запросов / OOM"
    group: memory_processes
    priority: P2
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.errors, system.query_log, system.metrics, system.events]
    interval: 15m
    query: |
      SELECT
        toUInt64((SELECT countIf(code = 241 AND last_error_time >= now() - INTERVAL 24 HOUR)
                  FROM system.errors)) AS oom_24h,
        toInt64((SELECT round(quantile(0.99)(memory_usage))
                 FROM system.query_log
                 WHERE type = 'QueryFinish' AND event_date >= today() - 1
                   AND event_time >= now() - INTERVAL 24 HOUR AND memory_usage > 0)) AS p99_query_memory,
        toInt64((SELECT round(avg(memory_usage))
                 FROM system.query_log
                 WHERE type = 'QueryFinish' AND event_date >= today() - 1
                   AND event_time >= now() - INTERVAL 24 HOUR AND memory_usage > 0)) AS avg_memory_per_query,
        toInt64((SELECT round(max(memory_usage))
                 FROM system.query_log
                 WHERE type = 'QueryFinish' AND event_date >= today() - 1
                   AND event_time >= now() - INTERVAL 24 HOUR AND memory_usage > 0)) AS max_memory_per_query,
        toInt64((SELECT maxIf(value, metric = 'MemoryTracking') FROM system.metrics)) AS ch_memory_usage,
        toUInt64((SELECT maxIf(value, event = 'OutOfMemory') FROM system.events)) AS oom_count
    thresholds:
      - { metric: oom_24h, op: gte, value: 5,  severity: warning }
      - { metric: oom_24h, op: gte, value: 20, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { oom_24h: count, p99_query_memory: bytes, avg_memory_per_query: bytes,
                max_memory_per_query: bytes, ch_memory_usage: bytes, oom_count: count }
    owner: "clickwatch"
    labels: [P2, memory, daily]
    notes: >-
      Чек-лист п.18. Код 241 = Memory limit exceeded; p99 оценивается относительно max_memory_usage
      сервера (сравнение на стороне SaaS).
      Добавлены avg/max память на запрос (реестр №10-11), расход CH (№22) и счётчик
      events.OutOfMemory (№105; rate - SaaS).

  - id: 19
    uid: "ch.memory.crashes"
    title_en: "Server Crashes"
    title_ru: "Падения сервера (segfault)"
    group: memory_processes
    priority: P2
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.crash_log, system.asynchronous_metrics]
    since: "21.8"
    interval: 15m
    query: |
      SELECT
        toUInt64(countIf(crash_time >= now() - INTERVAL 24 HOUR))          AS crashes_24h,
        toUInt64((SELECT maxIf(value, metric = 'Uptime') FROM system.asynchronous_metrics))
                                                                            AS uptime_seconds
      FROM system.crash_log
    thresholds:
      - { metric: crashes_24h, op: gte, value: 1, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { crashes_24h: count, uptime_seconds: seconds }
    owner: "clickwatch"
    labels: [P2, stability, daily]
    notes: >-
      Чек-лист п.19. Любая запись crash_log - немедленный разбор (стек сохранён в таблице).
      uptime_seconds (реестр №42, №103): внезапный сброс uptime - рестарт даже без crash_log.

  - id: 20
    uid: "ch.memory.jemalloc_fragmentation"
    title_en: "Jemalloc Fragmentation"
    title_ru: "Фрагментация памяти (jemalloc)"
    group: memory_processes
    priority: P3
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.asynchronous_metrics]
    interval: 1h
    query: |
      SELECT
        round(maxIf(value, metric = 'JemallocMappedBytes'))   AS jemalloc_mapped,
        round(maxIf(value, metric = 'JemallocResidentBytes')) AS jemalloc_resident,
        round(maxIf(value, metric = 'JemallocActiveBytes'))   AS jemalloc_active,
        round((maxIf(value, metric = 'JemallocMappedBytes') - maxIf(value, metric = 'JemallocActiveBytes'))
              * 100.0 / nullIf(maxIf(value, metric = 'JemallocMappedBytes'), 0), 1) AS memory_fragmentation
      FROM system.asynchronous_metrics
      WHERE metric IN ('JemallocMappedBytes', 'JemallocResidentBytes', 'JemallocActiveBytes')
    thresholds:
      - { metric: memory_fragmentation, op: gte, value: 20, severity: warning }
      - { metric: memory_fragmentation, op: gte, value: 30, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { jemalloc_mapped: bytes, jemalloc_resident: bytes, jemalloc_active: bytes,
                memory_fragmentation: percent }
    owner: "clickwatch"
    labels: [P3, memory, weekly]
    notes: >-
      Чек-лист п.20. memory_fragmentation по формуле ClickWatch (mapped - active)/mapped
      (реестр №33, §12.1 реестр метрик ClickWatch); resident-колонка сохранена для сравнения.

  - id: 21
    uid: "ch.memory.thread_leak"
    title_en: "Thread Pool Leak"
    title_ru: "Потоки: аллокация против активных"
    group: memory_processes
    priority: P3
    applies_to: [standalone, replicated]
    scope: node
    tables: [system.metrics, system.asynchronous_metrics]
    interval: 1h
    query: |
      SELECT
        toUInt64(maxIf(value, metric = 'GlobalThread'))       AS threads_total,
        toUInt64(maxIf(value, metric = 'GlobalThreadActive')) AS threads_active,
        toUInt64(maxIf(value, metric = 'GlobalThread') - maxIf(value, metric = 'GlobalThreadActive')) AS threads_idle,
        toUInt64((SELECT maxIf(value, metric = 'ThreadingThreads') FROM system.asynchronous_metrics))
                                                                            AS threads_count
      FROM system.metrics
      WHERE metric IN ('GlobalThread', 'GlobalThreadActive')
    thresholds:
      - { metric: threads_idle,  op: gte, value: 50,   severity: warning }
      - { metric: threads_total, op: gte, value: 1000, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { threads_total: count, threads_active: count, threads_idle: count, threads_count: count }
    owner: "clickwatch"
    labels: [P3, memory, threads, weekly]
    notes: >-
      Чек-лист п.21. Устойчивая разница allocated/active - признак утечки или зависших задач.
      threads_count - из async.ThreadingThreads (реестр №44).

  # --------------------------------------------------------------------------
  # Блок E. Состояние СУБД и репликации (чек-лист 22-30)
  # --------------------------------------------------------------------------

  - id: 22
    uid: "ch.state.keeper_sessions"
    title_en: "Keeper Session Health"
    title_ru: "Сессии ZooKeeper/Keeper"
    group: dbms_state
    priority: P1
    applies_to: [replicated]
    scope: node
    tables: [system.replicas, system.metrics, system.asynchronous_metrics]
    since: "23.5"
    interval: 15m
    query: |
      SELECT
        toUInt64((SELECT countIf(is_session_expired) FROM system.replicas)) AS sessions_expired,
        toUInt64((SELECT countIf(total_replicas != active_replicas) FROM system.replicas)) AS tables_with_inactive_replicas,
        toUInt64((SELECT maxIf(value, metric = 'ZooKeeperSessions') FROM system.metrics)) AS zk_sessions,
        toUInt64((SELECT maxIf(value, metric = 'ZooKeeperOutstandingRequests') FROM system.asynchronous_metrics)) AS zk_outstanding_requests,
        round((SELECT maxIf(value, metric = 'ZooKeeperRequestLatency') FROM system.asynchronous_metrics), 1) AS zk_latency_ms,
        toUInt64((SELECT maxIf(value, metric = 'ZooKeeperWatchCount') FROM system.asynchronous_metrics)) AS zk_watch_count
    thresholds:
      - { metric: sessions_expired, op: gte, value: 1, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { sessions_expired: count, zk_sessions: count, zk_outstanding_requests: count,
                zk_latency_ms: ms, zk_watch_count: count }
    owner: "clickwatch"
    labels: [P1, replication, keeper, daily]
    notes: >-
      Чек-лист п.22. is_session_expired появился в ~23.5; на более старых версиях правило
      пропустится as skipped_unsupported (since: 23.5).
      Добавлены gauge Keeper (реестр №79-82): сессии, outstanding, latency, watches.
      Статус соединения Keeper (№88, только 25.x+) вынесен в правило id 46 - см. §12.6.

  - id: 23
    uid: "ch.state.readonly_replicas"
    title_en: "Read-only Replicas"
    title_ru: "Реплики/таблицы в read-only"
    group: dbms_state
    priority: P1
    applies_to: [replicated]
    scope: node
    tables: [system.replicas]
    interval: 2m
    query: |
      SELECT
        toUInt64(countIf(is_readonly)) AS replicas_readonly,
        countIf(total_replicas != active_replicas) AS tables_without_full_quorum,
        toUInt64(countIf(NOT is_readonly AND lost_part_count = 0)) AS replicas_healthy,
        toUInt64(count()) AS replicas_count,
        toUInt64(max(absolute_delay))        AS replication_lag_max,
        toUInt64(round(avg(absolute_delay))) AS replication_lag_avg
      FROM system.replicas
    thresholds:
      - { metric: replicas_readonly,   op: gte, value: 1,    severity: warning }
      - { metric: replicas_readonly,   op: gte, value: 5,    severity: critical }
      - { metric: replication_lag_max, op: gte, value: 300,  severity: warning }
      - { metric: replication_lag_max, op: gte, value: 1800, severity: critical }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { replicas_readonly: count, tables_without_full_quorum: count, replicas_healthy: count,
                replicas_count: count, replication_lag_max: seconds, replication_lag_avg: seconds }
    owner: "clickwatch"
    labels: [P1, replication, daily]
    notes: >-
      Чек-лист п.23. Устойчивость read-only > 5 мин подтверждает SaaS (переходы по времени).
      Добавлен replication lag (absolute_delay, реестр №73-74 - крупнейший пробел старого
      чек-листа; пороги 300/1800 с). replicas_healthy - упрощённый аналог №76 без
      is_session_expired (23.5+); session-часть контролирует правило id 22.
      Переименование readonly_tables -> replicas_readonly (совместимость с ClickWatch).

  - id: 24
    uid: "ch.state.lost_parts"
    title_en: "Lost Parts"
    title_ru: "Потерянные части"
    group: dbms_state
    priority: P1
    applies_to: [replicated]
    scope: node
    tables: [system.replicas]
    interval: 15m
    query: |
      SELECT
        toUInt64(countIf(lost_part_count > 0)) AS tables_with_lost_parts,
        toUInt64(max(lost_part_count))          AS max_lost_parts
      FROM system.replicas
    thresholds:
      - { metric: tables_with_lost_parts, op: gte, value: 1, severity: critical }
    threshold_version: 1
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { max_lost_parts: count }
    owner: "clickwatch"
    labels: [P1, data_loss, daily]
    notes: >-
      Чек-лист п.24. Инцидент потери данных - немедленный разбор (lost_part_count > 0).

  - id: 25
    uid: "ch.state.long_fetches"
    title_en: "Long Fetches"
    title_ru: "Долгие fetches частей"
    group: dbms_state
    priority: P2
    applies_to: [replicated]
    scope: node
    tables: [system.replicated_fetches, system.metrics]
    interval: 15m
    query: |
      SELECT
        toUInt64(count())        AS fetches_active,
        round(coalesce(max(elapsed), 0), 0) AS oldest_fetch_sec,
        toUInt64((SELECT maxIf(value, metric = 'ReplicatedFetch') FROM system.metrics)) AS fetch_pending
      FROM system.replicated_fetches
    thresholds:
      - { metric: oldest_fetch_sec, op: gte, value: 900,  severity: warning }
      - { metric: oldest_fetch_sec, op: gte, value: 3600, severity: critical }
      - { metric: fetches_active,   op: gte, value: 20,   severity: warning }
    threshold_version: 2
    thresholds_updated_at: "2026-10-28T00:00:00Z"
    thresholds_source: builtin
    unit_map: { oldest_fetch_sec: seconds, fetches_active: count, fetch_pending: count }
    owner: "clickwatch"
    labels: [P2, replication, daily]
    notes: >-
      Чек-лист п.25. Висящий GET_PART не тормозит очередь репликации незаметно.
      fetch_pending - gauge из metrics.ReplicatedFetch (реестр №84).

  - id: 26
    uid: "ch.state.parts_to_check"
    title_en: "Parts To Check"
    title_ru: "Проверка частей (верификация)"
    group: dbms_state
    priority: P2
    applies_to: [replicated]
    scope: node
    tables: [system.replicas]
